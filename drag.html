<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Solar Interactivo (Arrastrable)</title>
    <style>
        body {
            margin: 0;
            background-color: #0a0a1e;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            /* Important for touch devices to prevent scrolling while dragging */
        }

        /* Orientation warning */
        #orientation-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 12, 41, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        @media screen and (orientation: portrait) and (max-width: 1024px) {
            #orientation-warning {
                display: flex;
            }
        }

        #orientation-warning i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #ffcc00;
            animation: rotate 2s infinite ease-in-out;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        #orientation-warning h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        #orientation-warning p {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* Star background */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(white, rgba(255, 255, 255, .2) 2px, transparent 3px),
                radial-gradient(white, rgba(255, 255, 255, .15) 1px, transparent 2px),
                radial-gradient(white, rgba(255, 255, 255, .1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            z-index: -1;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="orientation-warning">
        <i class="fas fa-mobile-alt"></i>
        <h2>Por favor, gira tu dispositivo</h2>
        <p>Para una mejor experiencia, usa el modo horizontal.</p>
    </div>
    <div class="stars"></div>
    <div id="game-container">
        <canvas id="canvas-overlay"></canvas>
        <!-- HUD removed as per user request -->
    </div>

    <!-- Logic -->
    <script src="game_logic_drag.js"></script>
</body>

</html>
